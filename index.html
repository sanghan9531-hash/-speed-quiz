<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>스피드 퀴즈 쇼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: TV 퀴즈쇼 무대 — 로비는 6장의 주제 카드, 게임은 큰 단어 판 하나와 아래 버튼 3개 */
:root{
  --bg:#eef0f7; --stage:#ffffff; --fg:#1b1d33; --muted:#62668a; --line:#d5d8ea;
  --accent:#ff4d6d; --gold:#ffb703; --ok:#12a150; --bad:#e5383b; --pass:#5b6cff;
  --board:#1b1d33; --board-fg:#fdfcff;
  --otaku1:#ff5fa2; --otaku2:#8b5cf6;
  --f-display:"Black Han Sans","Jua",system-ui,sans-serif;
  --f-round:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12131f; --stage:#1c1e30; --fg:#eef0ff; --muted:#9aa0c7; --line:#2e3150;
  --accent:#ff6b85; --gold:#ffc43d; --ok:#2ec27e; --bad:#ff5a5f; --pass:#7d8bff;
  --board:#0a0b14; --board-fg:#fdfcff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12131f; --stage:#1c1e30; --fg:#eef0ff; --muted:#9aa0c7; --line:#2e3150;
  --accent:#ff6b85; --gold:#ffc43d; --ok:#2ec27e; --bad:#ff5a5f; --pass:#7d8bff;
  --board:#0a0b14; --board-fg:#fdfcff; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:20px;min-height:100%;box-sizing:border-box}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* 비밀 입력창 */
.secret{display:flex;gap:8px;align-items:center}
.secret input{flex:1;min-width:0;font:inherit;font-size:15px;padding:10px 14px;border-radius:999px;border:1.5px dashed var(--line);background:var(--stage);color:var(--fg)}
.secret input::placeholder{color:var(--muted)}
.secret .hint{font-size:12px;color:var(--muted);white-space:nowrap}

/* 로비 */
.marquee{text-align:center;display:flex;flex-direction:column;gap:6px;padding-block:8px}
.marquee .eyebrow{font-family:var(--f-round);color:var(--accent);letter-spacing:.2em;font-size:14px}
.marquee h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(44px,11vw,84px);line-height:1;text-wrap:balance}
.marquee h1 span{color:var(--accent)}
.marquee p{margin:0;color:var(--muted)}
.bulbs{display:flex;justify-content:center;gap:10px}
.bulbs i{width:9px;height:9px;border-radius:50%;background:var(--gold);animation:blink 1.2s infinite}
.bulbs i:nth-child(even){animation-delay:.6s}
@keyframes blink{50%{opacity:.25}}

.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:560px){.cats{grid-template-columns:repeat(2,1fr)}}
.cat{background:var(--stage);border:2px solid var(--line);border-radius:18px;padding:18px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;color:var(--fg);transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
.cat:hover{transform:translateY(-3px);border-color:var(--c)}
.cat::after{content:"";position:absolute;right:-24px;bottom:-24px;width:80px;height:80px;border-radius:50%;background:var(--c);opacity:.18}
.cat .ico{font-size:34px;line-height:1}
.cat .name{font-family:var(--f-display);font-size:28px}
.cat .cnt{font-size:13px;color:var(--muted)}
.cat.secret-card{display:none;grid-column:1/-1;background:linear-gradient(120deg,var(--otaku1),var(--otaku2));border-color:transparent;color:#fff;align-items:center;text-align:center}
.cat.secret-card .cnt{color:#ffe6f3}
.cat.mystery-card{display:none;grid-column:1/-1;background:repeating-linear-gradient(45deg,#1b1d33 0 18px,#24274a 18px 36px);border:2px dashed var(--gold);color:var(--gold);align-items:center;text-align:center}
.cat.mystery-card .cnt{color:#f6e7b8}
.cat.mystery-card.show{display:flex;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.mission{font-family:var(--f-round);font-size:clamp(16px,4.4vw,22px);background:var(--gold);color:#1b1d33;padding:6px 16px;border-radius:999px;display:none}
.mystery .mission{display:inline-block;animation:pop .4s}
.mystery .board{background:repeating-linear-gradient(45deg,#14152a 0 22px,#1a1c36 22px 44px);box-shadow:inset 0 0 0 6px var(--gold)}
.cat.hiphop-card{display:none;grid-column:1/-1;background:#0d0d0f;border:2px solid #e5383b;color:#fff;align-items:center;text-align:center}
.cat.hiphop-card .name{color:#ff5a5f;letter-spacing:.02em}
.cat.hiphop-card .cnt{color:#c9c9d1}
.cat.hiphop-card.show{display:flex;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.hiphop .board{background:#0d0d0f;box-shadow:inset 0 0 0 6px #e5383b}
.hiphop .timer .fill{background:#e5383b}
.board .q{font-family:var(--f-display);font-size:clamp(24px,6vw,40px);line-height:1.3;word-break:keep-all;text-wrap:balance;max-width:24ch}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt{background:var(--stage);color:var(--fg);border:2px solid var(--line);border-radius:14px;padding:14px 12px;font-family:var(--f-round);font-size:19px;text-align:left;display:flex;gap:10px;align-items:center;min-width:0}
.opt:hover{border-color:#e5383b}
.opt kbd{flex:none}
.opt.right{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.passrow{display:flex;justify-content:center}
.passrow .act{padding:12px 36px;font-size:22px}
.cat.secret-card.show{display:flex;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}

.rules{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;color:var(--muted);font-size:13px}
kbd{font-family:var(--f-round);background:var(--stage);border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:1px 7px;color:var(--fg)}

/* 게임 */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{font-family:var(--f-round);font-size:16px;padding:6px 14px;border-radius:999px;background:var(--c,var(--accent));color:#fff}
.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-variant-numeric:tabular-nums}
.score{background:var(--stage);border:1.5px solid var(--line);border-radius:14px;padding:8px;text-align:center}
.score b{display:block;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1}
.score small{color:var(--muted);font-size:13px}
.score.ok b{color:var(--ok)} .score.bad b{color:var(--bad)} .score.pass b{color:var(--pass)}

.timer{display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums}
.timer .bar{flex:1;height:14px;border-radius:999px;background:var(--line);overflow:hidden}
.timer .fill{height:100%;width:100%;background:var(--gold);border-radius:999px;transition:width .25s linear,background .3s}
.timer .t{font-family:var(--f-display);font-size:34px;min-width:3.2ch;text-align:right}
.timer.hurry .fill{background:var(--bad)}
.timer.hurry .t{color:var(--bad);animation:blink .5s infinite}

.board{background:var(--board);color:var(--board-fg);border-radius:24px;min-height:min(42vh,320px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px 16px;text-align:center;position:relative;overflow:hidden;box-shadow:inset 0 0 0 6px color-mix(in srgb,var(--c,var(--accent)) 70%,transparent)}
.board .no{font-family:var(--f-round);opacity:.6;font-size:15px}
.board .word{font-family:var(--f-display);font-size:clamp(44px,12vw,104px);line-height:1.05;word-break:keep-all;overflow-wrap:anywhere;text-wrap:balance}
.board .word.flip{animation:flip .28s ease-out}
@keyframes flip{0%{transform:translateY(24px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
.board .flash{position:absolute;inset:0;pointer-events:none;opacity:0}
.board .flash.ok{background:var(--ok);animation:fl .4s}
.board .flash.bad{background:var(--bad);animation:fl .4s}
.board .flash.pass{background:var(--pass);animation:fl .4s}
@keyframes fl{0%{opacity:.45}100%{opacity:0}}

.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.act{border-radius:18px;padding:18px 8px;font-family:var(--f-display);font-size:clamp(22px,6vw,32px);color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--b) 60%,#000);background:var(--b);transition:transform .08s,box-shadow .08s;display:flex;flex-direction:column;align-items:center;gap:2px}
.act small{font-family:var(--f-body);font-size:12px;opacity:.85}
.act:active{transform:translateY(5px);box-shadow:0 1px 0 color-mix(in srgb,var(--b) 60%,#000)}
.act.ok{--b:var(--ok)} .act.bad{--b:var(--bad)} .act.pass{--b:var(--pass)}

/* 카운트다운 */
.count{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 85%,transparent);z-index:5}
.count b{font-family:var(--f-display);font-weight:400;font-size:min(40vw,220px);color:var(--accent);animation:pop .5s}

/* 결과 */
.result-head{text-align:center;display:flex;flex-direction:column;gap:6px}
.result-head .big{font-family:var(--f-display);font-size:clamp(64px,18vw,128px);line-height:1;color:var(--ok)}
.result-head p{margin:0;color:var(--muted)}
.log{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.log span{font-family:var(--f-round);font-size:15px;padding:5px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--stage)}
.log .ok{border-color:var(--ok);color:var(--ok)}
.log .bad{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.log .pass{border-color:var(--pass);color:var(--pass)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{font-family:var(--f-round);font-size:18px;padding:12px 22px;border-radius:14px;background:var(--accent);color:#fff}
.btn.sec{background:var(--stage);color:var(--fg);border:1.5px solid var(--line)}

/* 오타쿠 모드 */
.otaku .board{background:linear-gradient(135deg,#2a0f3d,#4a1450);box-shadow:inset 0 0 0 6px var(--otaku1)}
.otaku .timer .fill{background:linear-gradient(90deg,var(--otaku1),var(--otaku2))}
.otaku .sparkle{display:block}
.sparkle{display:none;position:absolute;inset:0;pointer-events:none}
.sparkle i{position:absolute;color:#ffd6ec;font-style:normal;animation:tw 2s infinite;opacity:.0}
@keyframes tw{50%{opacity:.9;transform:scale(1.3)}}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:linear-gradient(120deg,var(--otaku1),var(--otaku2));color:#fff;font-family:var(--f-round);padding:12px 20px;border-radius:999px;z-index:6;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;animation:pop .5s}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  document.getElementById("quit").onclick=()=>finish();

  countdown(()=>{ state.running=true; state.end=Date.now()+TIME*1000; nextQ(); tick=setInterval(update,250); });

function nextQ(){
  const s=state; if(!s) return;
  if (s.i>=s.deck.length){ s.deck=shuffle(HIPHOP); s.i=0 }
  const [q,a,wrong]=s.deck[s.i++];
  s.cur={q,a,opts:shuffle([a,...wrong])}; s.lock=false;
  const w=document.getElementById("word");
  w.textContent=q; w.classList.remove("flip"); void w.offsetWidth; w.classList.add("flip");
  document.getElementById("no").textContent=`${s.log.length+1}번째 문제`;
  document.getElementById("opts").innerHTML = s.cur.opts.map((o,i)=>`<button class="opt" data-i="${i}"><kbd>${i+1}</kbd><span>${esc(o)}</span></button>`).join("");
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
}

function answer(i){
  const s=state; if(!s||!s.running||s.lock) return;
  s.lock=true;
  const btns=[...document.querySelectorAll(".opt")];
  const right=s.cur.opts.indexOf(s.cur.a);
  let a;
  if (i<0) a="pass"; else a = i===right ? "ok" : "bad";
  s[a]++; s.log.push({w:s.cur.a,a});
  btns[right].classList.add("right");
  if (a==="bad") btns[i].classList.add("wrong");
  document.getElementById("sOk").textContent=s.ok;
  document.getElementById("sBad").textContent=s.bad;
  document.getElementById("sPass").textContent=s.pass;
  const f=document.getElementById("flash"); f.className="flash"; void f.offsetWidth; f.className="flash "+a;
  if(a==="ok"){beep(880,.12,"triangle");setTimeout(()=>beep(1320,.18,"triangle"),90)}
  else if(a==="bad") beep(140,.3,"sawtooth",.1); else beep(440,.1,"sine",.1);
  setTimeout(()=>{ if(state===s && s.running) nextQ() }, a==="ok"?500:1100);
}

function beep(f, d, type="sine", v=.15){
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type; o.frequency.value=f; g.gain.value=v;
    o.connect(g); g.connect(ac.destination);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+d);
    o.start(); o.stop(ac.currentTime+d);
  }catch(e){}
}

  w.textContent=s.cur; w.classList.remove("flip"); void w.offsetWidth; w.classList.add("flip");
  document.getElementById("no").textContent = s.k==="mystery" ? `${s.log.length+1}번째 · ${s.curCat}` : `${s.log.length+1}번째 문제`;
  if (s.k==="mystery"){ const m=document.getElementById("mission"); m.textContent="미션: "+MISSIONS[Math.floor(Math.random()*MISSIONS.length)]; m.style.animation="none"; void m.offsetWidth; m.style.animation=""; }
}

function act(a){
  const s=state; if(!s||!s.running) return;
  s[a]++; s.log.push({w:s.cur,a});
  document.getElementById("sOk").textContent=s.ok;
  document.getElementById("sBad").textContent=s.bad;
  document.getElementById("sPass").textContent=s.pass;
  const f=document.getElementById("flash"); f.className="flash"; void f.offsetWidth; f.className="flash "+a;
  if(a==="ok"){beep(880,.12,"triangle");setTimeout(()=>beep(1320,.18,"triangle"),90)}
  else if(a==="bad") beep(140,.3,"sawtooth",.1);
  else beep(440,.1,"sine",.1);
  next();
}

function update(){
  const s=state; if(!s) return;
  const left=Math.max(0,(s.end-Date.now())/1000);
  const sec=Math.ceil(left);
  document.getElementById("t").textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`;
  document.getElementById("fill").style.width=(left/TIME*100)+"%";
  document.getElementById("timer").classList.toggle("hurry", sec<=10);
  if (sec<=10 && sec!==s.lastBeep && sec>0){ s.lastBeep=sec; beep(1000,.06,"square",.06) }
  if (left<=0) finish(true);
}

function finish(timeUp){
  clearInterval(tick);
  const s=state; if(!s) return lobby();
  s.running=false;
  if (timeUp) [784,659,523].forEach((f,i)=>setTimeout(()=>beep(f,.25,"triangle"),i*180));
  const msg = s.quiz ? (s.ok>=15?"국힙 고인물 인정 🎤🔥": s.ok>=10?"리스펙! 꽤 잘 아네요 🔥": s.ok>=5?"국힙 입문 완료 💪":"국힙 플레이리스트부터 들어보자 🎧") : s.ok>=25?"전설급 실력! 🏆": s.ok>=15?"엄청 잘했어요! 🔥": s.ok>=8?"좋아요, 한 판 더? 💪":"다음엔 더 잘할 수 있어요 🙂";
  app.innerHTML = `
    <div class="topbar"><span class="chip" style="--c:${s.cat.c}">${s.cat.ico} ${s.cat.name}</span><span class="chip" style="--c:var(--muted)">${timeUp?"시간 종료!":"게임 종료"}</span></div>
    <div class="result-head">
      <p>맞힌 개수</p>
      <div class="big">${s.ok}</div>
      <p>${msg}</p>
    </div>
    <div class="scores">
      <div class="score ok"><b>${s.ok}</b><small>정답</small></div>
      <div class="score bad"><b>${s.bad}</b><small>오답</small></div>
      <div class="score pass"><b>${s.pass}</b><small>패스</small></div>
    </div>
    <div class="log">${s.log.length? s.log.map(l=>`<span class="${l.a}">${esc(l.w)}</span>`).join("") : `<span>아직 푼 문제가 없어요</span>`}</div>
    <div class="row">
      <button class="btn" id="again">같은 주제 다시하기</button>
      <button class="btn sec" id="home">로비로</button>
    </div>`;
  document.getElementById("again").onclick=()=>start(s.k);
  document.getElementById("home").onclick=lobby;
  state=null;
}

document.addEventListener("keydown", e=>{
  if (!state || !state.running) return;
  if (state.quiz){
    if ("1234".includes(e.key) && e.key!==""){e.preventDefault();answer(+e.key-1)}
    else if (e.key===" "){e.preventDefault();answer(-1)}
    return;
  }
  if (e.key==="Enter"){e.preventDefault();act("ok")}
  else if (e.key===" "){e.preventDefault();act("pass")}
  else if (e.key==="x"||e.key==="X"||e.key==="ㅌ"){e.preventDefault();act("bad")}
});

lobby();
</script>
</body>
</html>
